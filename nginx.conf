# Static site for Estúdio Isaac B. Castro — listens on 8080 (Cloud Run default).
server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  absolute_redirect off;

  # compression for text assets (video, webp and woff2 are already compressed)
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/ld+json application/manifest+json application/xml image/svg+xml;

  # correct MIME type for the web manifest (everything else comes from nginx's default mime.types)
  location = /site.webmanifest { types { } default_type application/manifest+json; add_header Cache-Control "public, max-age=86400" always; }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # HTML and config: always revalidate, so edits go live immediately
  location = /index.html { add_header Cache-Control "no-cache" always; }
  location = /config.js  { add_header Cache-Control "no-cache" always; }

  # media, fonts and vendor libraries: long cache.
  # If you replace a file in /assets, give it a new name (or deploy under a new path) so browsers fetch it.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    # nginx serves static files with Accept-Ranges and 206 partial responses by default → mp4 seeking works
    location ~* \.mp4$ { add_header Cache-Control "public, max-age=31536000, immutable" always; add_header Accept-Ranges bytes always; }
  }
  location /vendor/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }

  # site CSS/JS: short cache, revalidated (file names are not hashed — there is no build step)
  location ~* ^/(css|js)/ { add_header Cache-Control "public, max-age=3600, must-revalidate" always; }
  location ~* \.(svg|png|ico|webmanifest|xml|txt)$ { add_header Cache-Control "public, max-age=86400" always; }

  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache" always; }
}
